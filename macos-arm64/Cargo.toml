[package]
name = "faber-host-macos-arm64"
version = "0.1.0"
edition = "2021"
description = "macOS arm64 host runtime prototype for Faber Wasm components"
license = "MIT"
publish = false

[dependencies]
faber = { package = "faber-runtime", path = "../../faber-runtime" }
host-kernel = { path = "../../host-kernel-rs" }
aleator = { path = "../../host-providers-rs/crates/aleator" }
consolum = { path = "../../host-providers-rs/crates/consolum" }
processus = { path = "../../host-providers-rs/crates/processus" }
solum = { path = "../../host-providers-rs/crates/solum" }
tempus = { path = "../../host-providers-rs/crates/tempus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = "45"

[dev-dependencies]
hygiene-ratchet = { path = "../../radix/crates/hygiene-ratchet" }
