[workspace]
members = [
    "crates/host-kernel",
    "crates/host-native",
    "crates/aleator",
    "crates/consolum",
    "crates/http",
    "crates/processus",
    "crates/provider-contracts",
    "crates/solum",
    "crates/tempus",
    "llvm",
    "macos-arm64",
    "wasm",
]
resolver = "2"

[profile.dev]
debug = 1
codegen-units = 256

[profile.test]
debug = 1
codegen-units = 256

# Non-Cargo host product: webgpu-browser/
# Library crates use explicit path deps (not workspace inheritance) so Faber's
# embedded core-support archive can path-depend on individual crates without
# shipping this workspace root or product hosts.
