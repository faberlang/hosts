[package]
name = "host-coordinator"
version = "0.1.0"
edition = "2024"
description = "Multi-device coordinator surface for Faber hosts (identity, topology, plans, transactions)"
license = "MIT"
publish = false

[lints.clippy]
pedantic = "deny"

[dependencies]
# GENRUST-CONTRACT: the faber/runtime/rust package (crate name faber). The
# coordinator consumes Valor/frame carriers only — no device session behavior
# enters the runtime contract (C2).
faber = { path = "../../../faber/runtime/rust" }
sha2 = "0.10"

[dev-dependencies]
hygiene-ratchet = { path = "../../../radix/crates/hygiene-ratchet" }
