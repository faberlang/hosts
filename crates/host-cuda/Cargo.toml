[package]
name = "host-cuda"
version = "0.1.0"
edition = "2024"
description = "Linux-buildable CUDA host driver binding and launch adapter for Faber"
license = "MIT"
publish = false

[dependencies]
faber = { path = "../../../faber/runtime/rust" }
host-coordinator = { path = "../host-coordinator" }
host-device-core = { path = "../host-device-core" }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
